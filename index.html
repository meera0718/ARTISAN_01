<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craft Map - Trichy</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body{margin:0;font-family:sans-serif}
    #map{height:100vh}
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const TRICHY = [10.7905, 78.7047];
    const BOUNDS = L.latLngBounds([10.65, 78.55], [10.95, 78.85]);

    const map = L.map('map', {
      center: TRICHY,
      zoom: 12,
      maxZoom: 20,
      minZoom: 11,
      maxBounds: BOUNDS,
      maxBoundsViscosity: 1.0
    });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  {attribution: 'Tiles © Esri'}).addTo(map);

    L.marker(TRICHY).addTo(map).bindPopup('Trichy - map works!').openPopup();
  </script>
</body>
</html>
